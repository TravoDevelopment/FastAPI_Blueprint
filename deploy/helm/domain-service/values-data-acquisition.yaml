# data-acquisition release:
#   helm upgrade --install data-acquisition deploy/helm/domain-service \
#     -f deploy/helm/domain-service/values-data-acquisition.yaml --set image.tag=<git-sha>

serviceName: data-acquisition

image:
  repository: ghcr.io/your-org/your-repo/data-acquisition

config:
  DB_SCHEMA: data_acquisition
  PROBLEM_TYPE_BASE_URI: https://errors.example.com
  # Share rate-limit counters across replicas, e.g. redis://redis:6379/2
  RATE_LIMIT_STORAGE_URI: memory://

existingSecret: data-acquisition-secrets

networkPolicy:
  allowedCallers: []   # other services' pods (app.kubernetes.io/name) that call this one directly
